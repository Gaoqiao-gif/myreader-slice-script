name: 自动切片并上传坚果云

on:
  # 1. 定时触发：每天北京时间 00:05 (对应 UTC 16:05) 准时为你切好当天的 6000 字
  schedule:
    - cron: '5 16 * * *'
  
  # 2. 手动触发：允许你在 GitHub 网页上点按钮随时运行测试
  workflow_dispatch:

# 【核心必改】开启读写权限，允许 GitHub Actions 自动更新账本并 push 回仓库
permissions:
  contents: write

jobs:
  run-slice-script:
    runs-on: ubuntu-latest

    steps:
    # 步骤 1：下载仓库里的代码、账本和 TXT 小说文件
    - name: 检出仓库代码
      uses: actions/checkout@v4

    # 步骤 2：设置 Python 环境
    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 步骤 3：读取你的 requirements.txt，并补上 EbookLib 以防 Gemini 的代码需要它
    - name: 安装脚本依赖
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install EbookLib

    # 步骤 4：运行切片脚本，安全注入坚果云的账号和应用密码
    - name: 运行切片并上传
      env:
        JIANGUOYUN_USER: ${{ secrets.JIANGUOYUN_USER }}
        JIANGUOYUN_PASS: ${{ secrets.JIANGUOYUN_PASS }}
      run: |
        python slice_and_upload.py

    # 步骤 5：【新增核心加固】把新代码产生的账本和历史进度文件强制提交并推回 GitHub 仓库
    - name: 强制同步账本进度回仓库
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        
        # 自动把代码里可能产生的所有账本、历史记录文件全部暂存起来
        git add progress.json sync_history.txt sync_history_lit_final.txt 2>/dev/null || true
        
        # 检查是否有文件改动，如果有就自动 commit 提交并 push 推出，完成闭环
        if ! git diff --cached --quiet; then
          git commit -m "🔄 自动更新切片进度账本 [skip ci]"
          git push
          echo "✅ 账本进度已成功同步回 GitHub 仓库！"
        else
          echo "ℹ️ 今日进度无变动，跳过 Git 提交。"
        fi
