name: Fangtian Reader Auto Sync

on:
  schedule:
    - cron: '0 23 * * *' # 每天北京时间早上 7 点（UTC 23点）自动运行
  workflow_dispatch: # 支持你在网页端手动点按钮运行

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    # 💡 赋予 Actions 写入仓库的权限，防止账本同步失败
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Python script
      env:
        # 🚀 核心连接：把网页上的 DAV 密钥拿出来，完美交接给 Python 代码
        DAV_ACCOUNT: ${{ secrets.DAV_ACCOUNT }}
        DAV_TOKEN: ${{ secrets.DAV_TOKEN }}
      run: |
        python get_daily_article.py

    # ==================== 👇 关键：把账本自动推回 GitHub 仓库 👇 ====================
    - name: Commit and push history files
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        
        # 自动抓取并添加同步账本
        git add sync_history_b.txt sync_history_lit_final_b.txt sync_history_lit_final.txt || true
        
        # 提交更改（如果没变化则跳过，防止报错）
        git commit -m "Auto update reader history records [skip ci]" || echo "No changes to commit"
        
        # 推送回仓库
        git push
