name: Fangtian Reader Auto Sync

on:
  schedule:
    - cron: '0 23 * * *' # 每天北京时间早上 7 点（UTC 23点）自动运行
  workflow_dispatch: # 支持你在网页端手动点按钮运行

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    # ⚠️ 关键权限：赋予 Actions 写入仓库的权限，否则无法推送账本
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Python script
      env:
        NUTSTORE_USER: ${{ secrets.NUTSTORE_USER }}
        NUTSTORE_PASSWORD: ${{ secrets.NUTSTORE_PASSWORD }}
      run: |
        python get_daily_article.py  # 假设你的脚本名字叫这个，请根据实际文件名修改

    # ==================== 👇 关键：把 B 项目的账本自动推回 GitHub 仓库 👇 ====================
    - name: Commit and push history files
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # 添加两个 B 项目专属账本
        git add sync_history_b.txt sync_history_lit_final_b.txt || true
        
        # 提交更改（如果没变化则跳过，防止报错）
        git commit -m "Auto update reader history records [skip ci]" || echo "No changes to commit"
        
        # 推送回仓库
        git push
