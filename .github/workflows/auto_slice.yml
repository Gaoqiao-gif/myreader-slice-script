name: Fangtian Reader Auto Sync

on:
  schedule:
    - cron: '5 7 * * *' # 每天北京时间凌晨 15:05（UTC 前一天 7点05分）自动运行
  workflow_dispatch: # 支持你在网页端手动点按钮运行

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    # 💡 赋予 Actions 写入仓库的权限，防止账本同步失败
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Python script
      env:
        # 🚀 核心连接：把网页上的 DAV 密钥拿出来，完美交接给 Python 代码
        DAV_ACCOUNT: ${{ secrets.DAV_ACCOUNT }}
        DAV_TOKEN: ${{ secrets.DAV_TOKEN }}
      run: |
        python get_daily_article.py

    - name: 自动同步本地对账本回 GitHub 仓库
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # 检查是否有对账本文件发生了变动
        git status
        
        # 将更新后的本地对账本文件加入暂存区
        git add sync_history_b.txt sync_history_lit_final_b.txt || true
        
        # 如果没有内容发生改变，跳过 commit
        git diff --staged --quiet || git commit -m "chore: auto-update local book sync histories [skip ci]"
        
        # 推送回当前分支
        git push
