name: 自动切片并上传坚果云

on:
  # 1. 配置定时触发：每天北京时间 00:05 (对应 UTC 16:05)
  schedule:
    - cron: '5 16 * * *'
  
  # 2. 配置手动触发：允许你在 GitHub 网页上点按钮随时运行
  workflow_dispatch:

jobs:
  run-slice-script:
    runs-on: ubuntu-latest

    steps:
    # 步骤 1：下载仓库里的代码和小说文件
    - name: 检出仓库代码
      uses: actions/checkout@v4

    # 步骤 2：设置 Python 环境
    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 步骤 3：安装 WebDAV 依赖库
    - name: 安装脚本依赖
      run: |
        python -m pip install --upgrade pip
        pip install webdavclient3

    # 步骤 4：运行切片脚本，并将 GitHub Secrets 安全地注入给脚本使用
    - name: 运行切片并上传
      env:
        JIANGUOYUN_USER: ${{ secrets.JIANGUOYUN_USER }}
        JIANGUOYUN_PASS: ${{ secrets.JIANGUOYUN_PASS }}
      run: |
        python slice_and_upload.py
